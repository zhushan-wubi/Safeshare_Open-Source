{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100" style="background-color: #ffeef4; padding: 20px;">
    <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
        <div class="card-header text-center bg-gradient-to-r from-pink-100 to-green-100 rounded-top">
            <h3 class="mb-0">🔐 查看秘密</h3>
        </div>
        <div class="card-body text-center">
            <!-- 密码输入区域 -->
            <div id="passwordSection">
                <p class="text-muted mb-4">请输入访问密码，查看后秘密将自动销毁</p>
                <div class="mb-3">
                    <input type="password" id="accessPasscode" class="form-control text-center" placeholder="请输入访问密码">
                </div>
                <button id="viewBtn" class="btn btn-primary w-100">查看秘密</button>
            </div>

            <!-- 加载状态 -->
            <div id="loadingSection" class="d-none">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <p class="text-muted">正在加载秘密...</p>
            </div>

            <!-- 错误提示区域 -->
            <div id="errorSection" class="d-none">
                <div class="alert alert-danger" id="errorText"></div>
                <button id="retryBtn" class="btn btn-outline-secondary w-100 mt-3">重试</button>
            </div>

            <!-- 秘密内容区域 -->
            <div id="contentSection" class="d-none">
                <h5 class="mb-3 text-muted">🌙 你的秘密</h5>
                <div class="p-3 bg-light rounded text-start mb-4" id="secretContent"></div>
                <!-- 动态提示文案：替换写死的"已销毁" -->
                <p class="text-muted small text-center" id="expireTip">✨ 秘密已销毁，无法再次查看</p>
            </div>
        </div>
    </div>
</div>

<script>
// 从URL获取秘密ID
const urlParams = new URLSearchParams(window.location.search);
const secretId = urlParams.get('key');

// 元素引用
const passwordSection = document.getElementById('passwordSection');
const loadingSection = document.getElementById('loadingSection');
const errorSection = document.getElementById('errorSection');
const contentSection = document.getElementById('contentSection');
const errorText = document.getElementById('errorText');
const secretContent = document.getElementById('secretContent');
const passcodeInput = document.getElementById('accessPasscode');
// 新增：动态提示文案元素
const expireTip = document.getElementById('expireTip');

// 查看秘密核心逻辑（已修复+新增动态提示）
document.getElementById('viewBtn').addEventListener('click', async () => {
    const passcode = passcodeInput.value.trim();
    if (!passcode) {
        showError("请输入访问密码");
        return;
    }

    passwordSection.classList.add('d-none');
    loadingSection.classList.remove('d-none');

    try {
        // 注意：secretId 要从 URL 路径获取，而非查询参数！
       const pathParts = window.location.pathname.split('/');
       const secretId = pathParts[pathParts.length - 1]; // 从 /view/xxx 中提取xxx

       const res = await fetch(`/api/secret/${secretId}`, {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ passcode: passcode })
        });
        
        // 必须先判断响应是否成功
        if (!res.ok) throw new Error('网络请求失败');
        
        const data = await res.json();
        loadingSection.classList.add('d-none');

        if (data.success) {
            // 成功显示内容 + 动态调整提示文案
            secretContent.textContent = data.secret;
            contentSection.classList.remove('d-none');
            
            // 核心修改：根据后端返回的过期模式显示不同提示
            if (data.is_burn) {
                // 阅后即焚模式 - 原提示
                expireTip.textContent = "✨ 秘密已销毁，无法再次查看";
            } else {
                // 24h/7天模式 - 动态提示
                expireTip.textContent = `✨ 该秘密${data.expire_text}有效，可重复查看`;
            }
        } else {
            // 失败只提示错误，区分不同错误类型
            let errMsg = data.error || "解锁失败";
            // 适配后端返回的错误类型，显示精准提示
            if (data.error_type === 'expired') {
                errMsg = data.error; // 24h/7天过期提示
            } else if (data.error_type === 'destroyed') {
                errMsg = "秘密已销毁，无法再次查看"; // 阅后即焚销毁
            } else if (data.error_type === 'not_unlock') {
                errMsg = "⏳ 还没到解锁时间，暂时无法查看"; // 时光胶囊未到时间
            } else if (data.error_type === 'pass_error') {
                errMsg = "密码错误，请重新输入"; // 密码错误
            }
            
            showError(errMsg);
            passwordSection.classList.remove('d-none');
        }
    } catch (err) {
        console.error(err);
        loadingSection.classList.add('d-none');
        showError("网络错误，请重试");
        passwordSection.classList.remove('d-none');
    }
});

// 重试按钮
document.getElementById('retryBtn').addEventListener('click', () => {
    errorSection.classList.add('d-none');
    passwordSection.classList.remove('d-none');
    passcodeInput.value = "";
});

// 显示错误
function showError(message) {
    errorText.textContent = message;
    errorSection.classList.remove('d-none');
}

// 回车提交
passcodeInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('viewBtn').click();
    }
});
</script>
{% endblock %}
