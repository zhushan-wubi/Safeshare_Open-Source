{% extends "base.html" %}

{% block title %}查看秘密 - SafeShare{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-lg border-0">
            <div class="card-header text-white py-3" style="background: linear-gradient(135deg, #9b59b6, #8e44ad);">
                <h4 class="mb-0"><i class="fas fa-lock-open me-2"></i>查看秘密</h4>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-info border-0 mb-4" style="background-color: #f0e6ff;">
                    <i class="fas fa-info-circle me-1"></i> 此秘密只能查看一次，查看后将被永久删除。
                </div>

                <div class="mb-4">
                    <label for="viewPasscode" class="form-label fw-bold">
                        <i class="fas fa-key me-1"></i> 输入访问密码
                    </label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="viewPasscode" placeholder="请输入查看密码">
                        <button class="btn btn-outline-secondary" type="button" id="toggleViewPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small class="text-muted">请输入分享者告诉你的密码</small>
                </div>

                <div class="d-grid mb-4">
                    <button id="viewSecretBtn" class="btn btn-lg py-3 text-white"
                        style="background: linear-gradient(135deg, #9b59b6, #8e44ad);">
                        <i class="fas fa-eye me-2"></i>查看秘密
                    </button>
                </div>

                <!-- 秘密内容区域 -->
                <div id="secretContentSection" class="d-none">
                    <hr>
                    <h5 class="fw-bold mb-3"><i class="fas fa-scroll me-2"></i>秘密内容</h5>
                    <div class="card bg-light border-0 mb-3">
                        <div class="card-body">
                            <div id="secretTextContent" class="secret-content"></div>
                        </div>
                    </div>
                    <div class="alert alert-danger border-0">
                        <h6 class="alert-heading"><i class="fas fa-exclamation-circle me-1"></i> 警告</h6>
                        <p class="mb-2 small">此页面关闭后，秘密将无法再次查看。</p>
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-danger" onclick="copySecretContent()">
                                <i class="fas fa-copy me-1"></i> 复制秘密内容
                            </button>
                            <button class="btn btn-outline-secondary" onclick="closeSecret()">
                                <i class="fas fa-trash-alt me-1"></i> 销毁并关闭
                            </button>
                        </div>
                    </div>
                </div>

                <div id="errorSection" class="d-none">
                    <div class="alert alert-danger border-0">
                        <i class="fas fa-times-circle me-1"></i> <span id="errorMsg"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // 从 URL 路径获取 secret_id
    const secretId = window.location.pathname.split('/').pop();

    // 显示/隐藏密码
    document.getElementById('toggleViewPassword').addEventListener('click', function() {
        const input = document.getElementById('viewPasscode');
        const type = input.type === 'password' ? 'text' : 'password';
        input.type = type;
        this.querySelector('i').className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // 查看秘密
    document.getElementById('viewSecretBtn').addEventListener('click', async function() {
        const passcode = document.getElementById('viewPasscode').value.trim();
        if (!passcode) {
            SafeShare.showMessage('请输入密码', 'warning');
            return;
        }

        this.disabled = true;
        this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>验证中...';

        try {
            const response = await fetch(`/api/secret/${secretId}?passcode=${encodeURIComponent(passcode)}`);
            const data = await response.json();

            if (data.success) {
                document.getElementById('secretTextContent').textContent = data.secret;
                document.getElementById('secretContentSection').classList.remove('d-none');
                // 隐藏输入区
                document.querySelector('.alert-info').classList.add('d-none');
                document.querySelector('.form-label').closest('.mb-4').classList.add('d-none');
                document.querySelector('.input-group').closest('.mb-4').classList.add('d-none');
                this.closest('.d-grid').classList.add('d-none');
                SafeShare.showMessage('秘密已解锁', 'success');
            } else {
                document.getElementById('errorMsg').textContent = data.error || '验证失败';
                document.getElementById('errorSection').classList.remove('d-none');
                SafeShare.showMessage(data.error || '密码错误或秘密不存在', 'danger');
            }
        } catch (err) {
            document.getElementById('errorMsg').textContent = '网络错误，请重试';
            document.getElementById('errorSection').classList.remove('d-none');
            SafeShare.showMessage('网络错误', 'danger');
        } finally {
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-eye me-2"></i>查看秘密';
        }
    });

    function copySecretContent() {
        const text = document.getElementById('secretTextContent').textContent;
        SafeShare.copyToClipboard(text);
    }

    function closeSecret() {
        if (confirm('确定要销毁秘密吗？销毁后将无法恢复。')) {
            document.getElementById('secretTextContent').textContent = '';
            document.getElementById('secretContentSection').classList.add('d-none');
            SafeShare.showMessage('秘密已销毁', 'success');
        }
    }
</script>

<style>
.secret-content {
    font-family: 'Courier New', monospace;
    font-size: 1rem;
    background-color: #f8f9fa;
    padding: 1rem;
    border-radius: 5px;
    border-left: 4px solid #9b59b6;
}
</style>
{% endblock %}
