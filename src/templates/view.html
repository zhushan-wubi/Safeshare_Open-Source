{% extends "base.html" %}

{% block title %}查看秘密{% endblock %}

{% block content %}
<div class="container" style="max-width: 800px;">
    <div class="text-center mb-4">
        <h2>🔐 查看秘密</h2>
        <p class="text-muted">请输入访问密码（如需）</p>
    </div>

    <!-- 普通秘密 / 时光胶囊 共用密码输入区 -->
    <div id="normalView" class="card" style="display: none;">
        <div class="card-header">输入密码</div>
        <div class="card-body">
            <input type="password" id="viewPasscode" class="form-control mb-3" placeholder="访问密码">
            <button id="viewSecretBtn" class="btn btn-primary w-100">查看秘密</button>
        </div>
    </div>

    <!-- 双人秘密专用 -->
    <div id="doubleView" class="card" style="display: none;">
        <div class="card-header">双人验证</div>
        <div class="card-body">
            <input type="password" id="passA" class="form-control mb-3" placeholder="密码A">
            <input type="password" id="passB" class="form-control mb-3" placeholder="密码B">
            <button id="viewDoubleBtn" class="btn btn-primary w-100">查看秘密</button>
        </div>
    </div>

    <!-- 秘密显示区 -->
    <div id="secretDisplay" class="card mt-4" style="display: none;">
        <div class="card-header">秘密内容</div>
        <div class="card-body">
            <div id="secretContent" class="p-3 bg-light rounded" style="white-space: pre-wrap;"></div>
            <div class="text-center mt-3">
                <div id="countdown" class="display-4 text-danger mb-3">10</div>
                <button id="copySecretBtn" class="btn btn-outline-secondary">复制内容</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-primary ms-2">返回首页</a>
            </div>
        </div>
    </div>

    <div id="errorMsg" class="alert alert-danger mt-3" style="display: none;"></div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 获取 URL 参数
const urlParams = new URLSearchParams(window.location.search);
const type = urlParams.get('type');
const id = urlParams.get('id');

let secretData = null;

function showError(msg) {
    const errDiv = document.getElementById('errorMsg');
    errDiv.innerText = msg;
    errDiv.style.display = 'block';
    setTimeout(() => errDiv.style.display = 'none', 3000);
}

function showSecret(content) {
    document.getElementById('secretDisplay').style.display = 'block';
    document.getElementById('secretContent').innerText = content;
    let seconds = 10;
    const countdownEl = document.getElementById('countdown');
    const timer = setInterval(() => {
        seconds--;
        countdownEl.innerText = seconds;
        if (seconds <= 0) {
            clearInterval(timer);
            document.getElementById('secretDisplay').style.display = 'none';
            showError('秘密已销毁');
        }
    }, 1000);
}

// 加载秘密
if (type === 'capsule') {
    const capsules = JSON.parse(localStorage.getItem('timeCapsules') || '[]');
    secretData = capsules.find(c => c.id === id);
    if (!secretData) {
        showError('时光胶囊不存在或已销毁');
    } else if (secretData.unlockDate > Date.now()) {
        showError(`此胶囊将于 ${new Date(secretData.unlockDate).toLocaleString()} 解锁`);
    } else {
        document.getElementById('normalView').style.display = 'block';
        document.getElementById('viewSecretBtn').onclick = () => {
            const inputPass = document.getElementById('viewPasscode').value;
            if (secretData.passcode && inputPass !== secretData.passcode) {
                showError('密码错误');
                return;
            }
            showSecret(secretData.secret);
            // 删除胶囊
            const updated = capsules.filter(c => c.id !== id);
            localStorage.setItem('timeCapsules', JSON.stringify(updated));
            document.getElementById('normalView').style.display = 'none';
        };
    }
} else if (type === 'double') {
    const doubles = JSON.parse(localStorage.getItem('doubleSecrets') || '[]');
    secretData = doubles.find(d => d.id === id);
    if (!secretData) {
        showError('双人秘密不存在或已销毁');
    } else {
        document.getElementById('doubleView').style.display = 'block';
        document.getElementById('viewDoubleBtn').onclick = () => {
            const passA = document.getElementById('passA').value;
            const passB = document.getElementById('passB').value;
            if (passA !== secretData.passA || passB !== secretData.passB) {
                showError('密码错误，请确认两人密码');
                return;
            }
            showSecret(secretData.secret);
            // 删除
            const updated = doubles.filter(d => d.id !== id);
            localStorage.setItem('doubleSecrets', JSON.stringify(updated));
            document.getElementById('doubleView').style.display = 'none';
        };
    }
} else {
    // 普通秘密
    const normals = JSON.parse(localStorage.getItem('normalSecrets') || '[]');
    secretData = normals.find(n => n.id === id);
    if (!secretData) {
        showError('秘密不存在或已过期');
    } else {
        document.getElementById('normalView').style.display = 'block';
        document.getElementById('viewSecretBtn').onclick = () => {
            const inputPass = document.getElementById('viewPasscode').value;
            if (inputPass !== secretData.passcode) {
                showError('密码错误');
                return;
            }
            showSecret(secretData.secret);
            // 删除
            const updated = normals.filter(n => n.id !== id);
            localStorage.setItem('normalSecrets', JSON.stringify(updated));
            document.getElementById('normalView').style.display = 'none';
        };
    }
}

// 复制功能
document.getElementById('copySecretBtn')?.addEventListener('click', () => {
    const content = document.getElementById('secretContent').innerText;
    navigator.clipboard.writeText(content).then(() => {
        alert('已复制到剪贴板');
    }).catch(() => alert('复制失败'));
});
</script>
{% endblock %}
