<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}莫奈的秘密花园{% endblock %}</title>

    <!-- 必要CDN（弹窗、栅格必须用，不删） -->
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">

    <!-- 独立CSS + 版本号强制清缓存 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=100">
</head>
<body>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="container">
            <div class="footer-decor">🌿 ✨ 🎨 🌿 ✨ 🎨</div>
            <div class="social-links">
                <a href="#"><i class="fa fa-heart"></i></a>
                <a href="#"><i class="fa fa-leaf"></i></a>
                <a href="#"><i class="fa fa-lock"></i></a>
                <a href="#"><i class="fa fa-paint-brush"></i></a>
            </div>
            <p>© 2026 莫奈的秘密花园 · 以温柔笔触，守护每一份隐秘心事</p>
            <p class="small text-muted">所有数据仅存储于本地，隐私绝对安全</p>
        </div>
    </footer>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
