<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SafeShare - 安全秘密分享{% endblock %}</title>
    
    <!-- 引入Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- 引入我们自己的CSS -->
    <!-- 在 head 部分修改CSS链接 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt"></i> SafeShare
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="https://github.com/yourusername/SafeShare" target="_blank">
                    <i class="fab fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="container mt-4">
        {% block content %}
        <!-- 这里的内容会被其他页面替换 -->
        {% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer mt-5 py-3 bg-light">
        <div class="container text-center">
            <span class="text-muted">
                <i class="fas fa-code"></i> 使用 
                <a href="https://flask.palletsprojects.com/" target="_blank">Flask</a> + 
                <a href="https://getbootstrap.com/" target="_blank">Bootstrap</a> 构建 |
                <i class="fas fa-heart text-danger"></i> 开源项目
            </span>
            <br>
            <small class="text-muted">
                🔒 安全提醒: 请勿分享极度敏感的信息
            </small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 我们自己的JS -->
    <script src="/static/js/main.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
